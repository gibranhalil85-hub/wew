<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIBE ZONE - Streaming Video Viral</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #121526, #08090f);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }
    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }
    .header-zone {
      margin-bottom: 20px;
      padding-top: 10px;
    }
    .brand-name {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #00f2fe, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    }
    .brand-sub {
      font-size: 0.8rem;
      color: #8888a0;
      margin-top: 4px;
      text-transform: lowercase;
    }
    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(0, 242, 254, 0.3);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
      margin-top: 15px;
    }
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .btn-fullversion {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #ff007f, #7928ca);
      color: #fff;
      font-weight: bold;
      font-size: 0.95rem;
      text-decoration: none;
      border-radius: 10px;
      margin-top: 15px;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      transition: transform 0.2s;
      position: relative;
      z-index: 10;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-fullversion:active {
      transform: scale(0.98);
    }
    footer {
      margin-top: 30px;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header-zone">
      <div class="brand-name">FULLVIBE ZONE HUB</div>
      <div class="brand-sub">watch trending viral video every day.</div>
    </div>

    <!-- NATIVE BANNER (Tanpa Card dan Tanpa Container) -->
    <script data-cfasync="false" async type="text/javascript" src="//kr.sayyidvanglo.com/ta8Y7TYq8a6/160136"></script>

    <!-- Pemutar Video -->
    <div class="video-container">
      <video id="videy-player" controls playsinline preload="metadata">
        <source id="videy-source" src="" type="video/mp4">
        Browser Anda tidak mendukung pemutar video ini.
      </video>
    </div>

    <!-- Tombol Full Version -->
    <a href="https://www.facebook.com/groups/foundyourgirl" id="btn-full" class="btn-fullversion" target="_blank">
      🔥 WATCH FULL VERSION (HD)
    </a>

    <footer>
      &copy; 2026 VIBE ZONE HUB. All rights reserved.
    </footer>
  </div>

  <script>
    // Anti Klik Kanan & Inspect Element
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
      if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
        e.preventDefault();
        return false;
      }
    });

    const DEFAULT_VIDEY_ID = "c89sL2uO"; 
    // Mengambil parameter 'v' dari URL (contoh: ?v=xxxxxx)
    const urlParams = new URLSearchParams(window.location.search);
    const videyId = urlParams.get('v') || DEFAULT_VIDEY_ID;

    // Memuat sumber video berdasarkan ID
    const videoSource = document.getElementById('videy-source');
    videoSource.src = `https://cdn.videy.co/${videyId}.mp4`;
    document.getElementById('videy-player').load();
  </script>
</body>
</html>
